<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayni Desk page</title>
<script src="../ayni-desk-rule.js"></script>
<script src="../ayni-i18n.js"></script>
<script src="../ayni-util.js"></script>
<script src="../ayni-tiling.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ayni-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="../ayni-base.css">
<link rel="stylesheet" href="../ayni-buttons.css">
<link rel="stylesheet" href="../ayni-toasts.css">
<link rel="stylesheet" href="../ayni-dialogs.css">
<link rel="stylesheet" href="../ayni-menus.css">
<link rel="stylesheet" href="../ayni-lists.css">
<link rel="stylesheet" href="../ayni-help.css">
<link rel="stylesheet" href="../ayni-fields.css">
<link rel="stylesheet" href="../ayni-pickers.css">
<link rel="stylesheet" href="../ayni-desktop.css">
<link rel="stylesheet" href="../ayni-deskpage.css">
<style>
/* Demo page only: this page's launcher, its two sample apps. */
#menu:not([hidden]) { display: flex; gap: 8px; width: auto; height: auto; padding: 12px; }
</style>
<script src="../ayni-icons.js" defer></script>
<script src="../ayni-base.js" defer></script>
<script src="../ayni-icons-more.js" defer></script>
<script src="../ayni-buttons.js" defer></script>
<script src="../ayni-toasts.js" defer></script>
<script src="../ayni-dialogs.js" defer></script>
<script src="../ayni-menus.js" defer></script>
<script src="../ayni-lists.js" defer></script>
<script src="../ayni-help.js" defer></script>
<script src="../ayni-fields.js" defer></script>
<script src="../ayni-pickers.js" defer></script>
</head>
<body>
<!-- The page has no #desktop: Ayni.deskPage puts the desk, the bar, the "⋮" and the switcher here. What is this
     page's own: the launcher in #menu and its two sample apps, each a page in a window (deskpage-window.html). No
     gadgets: a clock, the weather and such are an app's (guidelines 17.4), put in the slots. -->
<script src="../ayni-deskpage.js"></script>
<script>
( function ()
{
    var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    var APPS = {
        notes: { name: 'Notes', svg: SVG + '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>' },
        sums:  { name: 'Sums',  svg: SVG + '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>' }
    };
    var menu = null;
    // A page's app: ?app= in its address
    function appOf( url ) { try { return new URL( url, location.href ).searchParams.get( 'app' ) || ''; } catch( e ) { return ''; } }

    window.deskD = Ayni.deskPage( {
        appName: 'Ayni',
        APPS: APPS,
        appOf: appOf,
        openMenu: function () { menu.hidden = false; },
        closeMenu: function () { if( menu ) menu.hidden = true; }
    } );

    // The launcher: one button per sample app; each opens it in a new window.
    menu = document.getElementById( 'menu' );
    menu.innerHTML = Object.keys( APPS ).map( function ( k )
    {
        return '<button class="btn large bordered" type="button" data-app="' + k + '">' + APPS[ k ].svg + '<span>' + APPS[ k ].name + '</span></button>';
    } ).join( '' );
    menu.addEventListener( 'click', function ( e )
    {
        var b = e.target.closest( '[data-app]' );
        if( ! b ) return;
        menu.hidden = true;
        AyniDesk.open( 'deskpage-window.html?app=' + b.dataset.app );
    } );
    document.getElementById( 'menuBtn' ).addEventListener( 'click', function () { menu.hidden = ! menu.hidden; } );

    document.addEventListener( 'DOMContentLoaded', function () { Ayni.ready.then( function ()
    {
        Ayni.help( {
            title: 'Desk page',
            lead: 'Windows that each hold a whole page. Everything here is Ayni\'s but the two sample apps.',
            rows: [
                { sel: '#menuBtn', icon: 'grid', text: 'Opens the apps.' },
                { sel: '#tasks', icon: 'window', name: 'Windows', text: 'One chip per window. The one in front shows its buttons: Scale or Resize, minimise, maximise and close.' },
                { sel: '#moreBtn', icon: 'more', text: 'Free / Tile, Sticky windows, Scale on open, the bar and Raised controls. A right-click, or a long press, on an empty spot of the desk opens it too.' }
            ]
        } );
        // The first visit: two sample windows (later ones come back as they were left).
        if( ! AyniDesk.windows().length ) { AyniDesk.open( 'deskpage-window.html?app=notes' ); AyniDesk.open( 'deskpage-window.html?app=sums' ); }
    } ); } );
} )();
</script>
</body>
</html>
