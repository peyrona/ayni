<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayni dialogs family only</title>
<!-- A page that takes the base, the buttons, notifications and dialogs families, and nothing else.
     #demo opens a confirmation (for screenshots). -->
<script src="../ayni-i18n.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ayni-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="../ayni-base.css">
<link rel="stylesheet" href="../ayni-buttons.css">
<link rel="stylesheet" href="../ayni-toasts.css">
<link rel="stylesheet" href="../ayni-dialogs.css">
<script src="../ayni-icons.js" defer></script>
<script src="../ayni-base.js" defer></script>
<script src="../ayni-buttons.js" defer></script>
<script src="../ayni-toasts.js" defer></script>
<script src="../ayni-dialogs.js" defer></script>
<script type="module">
  await Ayni.ready;
  window.L = [];
  document.getElementById('form-x').addEventListener('click', () => L.push('form x'));
  document.getElementById('form-ok').addEventListener('click', () => L.push('form ok'));
  document.getElementById('handled').addEventListener('keydown', (e) => { if (e.key === 'Escape') e.preventDefault(); });
  if (location.hash === '#demo') Ayni.confirm({ title: 'Delete contract.pdf?', body: 'The file goes to the bin.\nYou can restore it for 30 days.', confirm: 'Delete', danger: true });
</script>
<style>body { background: var(--bg); color: var(--text); font: .9rem/1.45 var(--font-sans); padding: 40px; margin: 0; min-height: 200vh; }</style>
</head>
<body>
<p><button class="btn" id="opener" data-open-dialog="d-form" data-tip="Rename…"><span class="icon" data-icon="edit"></span></button> <input class="input" id="outside"></p>

<!-- A small dialog: a switch in its title row, two fields, a text area, a bottom row with Close and the default button -->
<dialog class="panel" id="d-form" aria-labelledby="form-t">
  <header><h2 id="form-t">Rename file</h2><label class="switch">Keep extension<input type="checkbox" role="switch" id="form-sw"></label></header>
  <div class="body">
    <input class="input" id="form-name" value="notes.txt" aria-label="Name">
    <input class="input" id="handled" aria-label="Handles Esc itself">
    <textarea id="form-note" aria-label="Note"></textarea>
    <div popover id="form-pop">A popup inside the dialog</div>
  </div>
  <footer><button class="btn" id="form-x" data-close data-tip="Close"><span class="icon" data-icon="close"></span></button><button class="btn primary" id="form-ok" data-tip="Save"><span class="icon" data-icon="check"></span></button></footer>
</dialog>

<!-- A message: no field, its lone Close in the title row -->
<dialog class="panel" id="d-msg" aria-labelledby="msg-t">
  <header><h2 id="msg-t">Upload complete</h2><button class="btn" data-close data-tip="Close" id="msg-x"><span class="icon" data-icon="close"></span></button></header>
  <div class="body"><p id="msg-p">3 files were uploaded to Invoices.</p></div>
</dialog>

<!-- No Close button at all -->
<dialog class="panel" id="d-bare"><div class="body"><p>Nothing to press.</p></div></dialog>

<!-- An element marked autofocus wins over the first field -->
<dialog class="panel" id="d-auto"><header><h2>Two fields</h2></header><div class="body"><input class="input" id="auto-1" aria-label="One"><input class="input" id="auto-2" autofocus aria-label="Two"></div></dialog>

<!-- Fields that come after loading -->
<dialog class="panel" id="d-late"><header><h2>Loading</h2><button class="btn" data-close data-tip="Close"><span class="icon" data-icon="close"></span></button></header><div class="body" id="late-body"></div></dialog>

<!-- A big dialog -->
<dialog class="panel big" id="d-big"><header><h2>Preferences</h2><button class="btn" data-close data-tip="Close"><span class="icon" data-icon="close"></span></button></header><div class="body"><input class="input" aria-label="Name"></div></dialog>

<!-- A long text: the small dialog stops at 460 px -->
<dialog class="panel" id="d-long"><header><h2>Long</h2><button class="btn" data-close data-tip="Close"><span class="icon" data-icon="close"></span></button></header><div class="body"><p>A long line of text that would make the dialog far wider than its limit if nothing stopped it from growing on a wide screen.</p></div></dialog>

<!-- Modeless -->
<dialog class="panel" id="d-modeless"><header><h2>Find</h2><button class="btn" data-close data-tip="Close" id="modeless-x"><span class="icon" data-icon="close"></span></button></header><div class="body"><input class="input" id="modeless-q" aria-label="Find"></div></dialog>
</body>
</html>
